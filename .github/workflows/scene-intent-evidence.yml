name: Scene intent browser evidence

on:
  push:
    branches: [main, dev_v1.0]
  pull_request:
    branches: [main, dev_v1.0]

permissions:
  contents: read

concurrency:
  group: scene-intent-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scene-intent:
    name: Saved intent desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXUS_LIVE_ENABLED: 'false'
      NEXUS_OVERAGE_CONFIRMED_OFF: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium
      - name: Install Chinese fonts
        run: sudo apt-get update && sudo apt-get install --yes fonts-noto-cjk
      - name: Exercise only saved scene intent workflows
        run: npm run test:e2e -- e2e/scene-intent.spec.js --project=desktop-chromium --project=mobile-chromium
      - name: Preserve compact scene intent screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scene-intent-screenshots
          path: test-results/scene-intent*/**/*.png
          if-no-files-found: warn
          retention-days: 7
