name: Manual bounded live-provider smoke

on:
  workflow_dispatch:
    inputs:
      approve_live_smoke:
        description: 'Authorize up to five synthetic provider calls; confirm overage is disabled'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: manual-live-smoke
  cancel-in-progress: false

jobs:
  live-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.approve_live_smoke == true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out the reviewed dispatch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js without dependency cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # Uses only built-in Node.js modules; do not install dependencies or upload outputs.
      - name: Run approved bounded synthetic smoke
        run: node scripts/live-smoke.mjs
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          NEXUS_API_BASE_URL: https://opencode.ai/zen/go/v1
          NEXUS_API_MODEL: deepseek-v4.1-flash
          NEXUS_SMOKE_APPROVED: 'true'
          NEXUS_LIVE_ENABLED: 'true'
          NEXUS_OVERAGE_CONFIRMED_OFF: 'true'
          NEXUS_MAX_OUTPUT_TOKENS: '3000'
          NEXUS_MAX_CALLS: '5'
